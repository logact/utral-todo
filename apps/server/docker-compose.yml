services:
  app:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    container_name: utral-todo-server
    restart: unless-stopped
    ports:
      - "8080:3001"
    volumes:
      - /var/lib/utral-todo/data:/var/lib/utral-todo/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - API_TOKEN=${API_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
